name: 发布 Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release_zip_file:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.2.2

      - name: 创建发布包
        run: |
          set -euo pipefail
          zip -r wgi_openvfd_x96max.zip custom_components README.md \
            -x '*/.git/*' \
            -x '.git/*' \
            -x '.github/*' \
            -x '*.pyc' \
            -x '*/__pycache__/*' \
            -x '*/config.yaml'

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: wgi_openvfd_x96max.zip
